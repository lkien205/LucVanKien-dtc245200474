limit_req_zone $binary_remote_addr zone=attendance_limit:10m rate=10r/m;

log_format json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
    '"status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
    '"http_user_agent":"$http_user_agent"}';

server {
    listen 8080;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_backend app:8080;

    access_log /var/log/app/nginx-access.log json;
    error_log /var/log/app/nginx-error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 1m;

    location = /metrics {
        allow 172.28.0.0/16;
        deny all;
        proxy_pass http://$app_backend/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /nginx_status {
        stub_status;
        allow 172.28.0.0/16;
        deny all;
    }

    location / {
        limit_req zone=attendance_limit burst=15 nodelay;
        proxy_pass http://$app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Powered-By;
    }
}
