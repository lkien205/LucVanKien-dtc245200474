server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: attendance-nginx
          __path__: /var/log/app/nginx-access.log
    pipeline_stages:
      - json:
          expressions:
            status: status
            method: request
      - labels:
          status:
  - job_name: php
    static_configs:
      - targets: [localhost]
        labels:
          job: attendance-php
          __path__: /var/log/app/php-error.log
  - job_name: apache
    static_configs:
      - targets: [localhost]
        labels:
          job: attendance-apache
          __path__: /var/log/app/apache-error.log
