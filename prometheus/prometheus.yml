global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: attendance
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: mysql
    static_configs:
      - targets: ["mysql-exporter:9104"]
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]
